app:
  name: all-dev-immich
  version: "2.5.6"

# Sidecar mode.
#
# Immich runs its own snapd-managed services (postgresql, redis, server, ml,
# createdb). The CT engine does NOT launch or manage Immich — it runs as a
# lightweight reporting sidecar that validates/persists the config Control
# Tower pushes via `snap set` and streams status callbacks back to CT.
run:
  command: ""

# Status reported on the initial and periodic callbacks. Immich's web server
# listens on port 3001 (see src/immich-server.sh).
sidecar:
  status_command: "hostname -I | awk '{print \"Immich: http://\" $1 \":3001\"}'"

output:
  mode: logs
  interval: 5
  initial_event: "message_initial"
  periodic_event: "message"
  stop_event: "deployment_stop"

# Configuration schema — intentionally empty.
#
# All app settings are HARDCODED in the snap, so Control Tower does not need
# to (and must not) push them via `snap set`:
#   - DB_* / REDIS_*  -> snapcraft.yaml `server` app `environment:` block
#                        (127.0.0.1:5433 immich/postgres/postgres, redis :6379)
#   - ML              -> off: `ml` service is install-mode disabled and the
#                        server wrapper defaults IMMICH_MACHINE_LEARNING_ENABLED
#                        to false.
#
# This also sidesteps snapd's option-name validation: the Immich-style keys
# (DB_PORT, DB_PASSWORD, …) are uppercase/underscore and snapd rejects them as
# "invalid option name", which fails the configure-hook change. Only the
# automatic ct-* keys (handled by ct-engine, all lowercase/hyphen) are used.
config: {}
