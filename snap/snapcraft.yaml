name: all-dev-immich

adopt-info: immich

base: core24

grade: stable
confinement: strict
# xz (the snapcraft default) compresses ~2x better than lzo, roughly halving
# the download. Trade-off: slightly slower first decompression at mount/start,
# which is fine for a long-running server snap.
compression: xz

icon: snap/gui/icon.png

license: "CC-BY-NC-SA-4.0 AND AGPL-3.0"

website: https://github.com/Half-Silver/all-dev-immich
source-code: https://github.com/Half-Silver/all-dev-immich
issues: https://github.com/Half-Silver/all-dev-immich/issues
contact: https://github.com/Half-Silver

summary: High performance self-hosted photo and video management solution.

description: |
  Immich is a high performance self-hosted photo and video management solution.

  This snap is optimized for Ubuntu Core. FFmpeg, Redis, and PostgreSQL are bundled.

  The snap is intended to work seamlessly with:
    - caddy

  Immich will expose itself on port 3001 by default and can be accessed
  locally or through reverse proxies.

assumes:
  - snapd2.68

package-repositories:
  - type: apt
    key-id: B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
    url: https://apt.postgresql.org/pub/repos/apt
    suites: [noble-pgdg]
    components: [main]

platforms:
  amd64:
  arm64:

lint:
  ignore:
    - library

system-usernames:
  _daemon_: shared

layout:
  /etc/fonts:
    bind: $SNAP/etc/fonts

  /etc/ImageMagick-6:
    symlink: $SNAP/etc/ImageMagick-6

  /usr/share/fonts:
    bind: $SNAP/usr/share/fonts

  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/ImageMagick-6.9.11:
    symlink: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/ImageMagick-6.9.11

  /usr/lib/postgresql:
    bind: $SNAP/usr/lib/postgresql

  /usr/share/postgresql:
    bind: $SNAP/usr/share/postgresql

  # exiftool-vendored spawns the exiftool perl script with a sanitized
  # environment that drops PERL5LIB, so the perl child falls back to its
  # compiled-in default @INC (host paths, which under core24 have no perl
  # modules) and aborts with "Can't locate strict.pm". That stalls
  # exiftool.version(), which hangs /api/server/about and blocks web UI
  # login. Bind the bundled perl module dirs onto those default @INC
  # paths so perl resolves its modules for any process, env or not.
  # @INC uses the short version (5.38) for the priv/arch libs while the
  # package installs them under 5.38.2, so map short -> full for those.
  /usr/share/perl5:
    bind: $SNAP/usr/share/perl5

  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/perl-base:
    bind: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/perl-base

  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/perl5/5.38:
    bind: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/perl5/5.38

  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/perl/5.38:
    bind: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/perl/5.38.2

  /usr/share/perl/5.38:
    bind: $SNAP/usr/share/perl/5.38.2

apps:
  redis:
    command: usr/bin/redis.sh

    daemon: simple
    install-mode: enable

    restart-condition: always

    plugs:
      - network
      - network-bind

  server:
    after:
      - postgresql
      - redis
      - createdb

    command: usr/bin/immich-server.sh

    daemon: simple
    install-mode: enable

    restart-condition: always

    plugs:
      - network
      - network-bind
      - mount-observe
      - opengl
      - removable-media

    environment:
      DB_PORT: "5433"
      DB_HOSTNAME: 127.0.0.1
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE_NAME: immich

      REDIS_PORT: "6379"
      REDIS_HOSTNAME: 127.0.0.1

      NODE_ENV: production
      IMMICH_ENV: production

      IMMICH_BUILD_DATA: ${SNAP}/usr/lib/immich/build

      PATH: ${SNAP}/usr/lib/postgresql/16/bin:${PATH}

      # Puts the bundled perl modules on @INC for perl invoked directly by
      # the server process. Child processes spawned by exiftool-vendored do
      # NOT inherit this (it sanitizes their env), so the actual exiftool
      # fix lives in the `layout` block, which maps the same modules onto
      # perl's default @INC. This var is the belt to that layout's braces.
      PERL5LIB: ${SNAP}/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/perl-base:${SNAP}/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/perl/5.38.2:${SNAP}/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/perl5/5.38:${SNAP}/usr/share/perl/5.38.2:${SNAP}/usr/share/perl5:${SNAP}/usr/share/perl:${PERL5LIB}

  postgresql:
    command: usr/bin/postgresql.sh start

    daemon: simple
    install-mode: enable

    stop-command: usr/bin/postgresql.sh stop
    reload-command: usr/bin/postgresql.sh reload

    restart-condition: always

    plugs: &_pgplugs
      - network
      - network-bind

    environment: &_pgenv
      PGDATA: ${SNAP_COMMON}/postgresql/database
      PGPASSFILE: ${SNAP_COMMON}/postgresql/.pgpass

      PATH: ${SNAP}/usr/lib/postgresql/16/bin:${PATH}

  createdb:
    after:
      - postgresql

    command: usr/bin/postgresql.sh createdb

    daemon: oneshot
    install-mode: enable

    plugs: *_pgplugs

    environment: *_pgenv

  ml:
    after:
      - createdb

    command: usr/bin/machine-learning.sh

    daemon: simple
    install-mode: enable

    restart-condition: always

    plugs:
      - network
      - network-bind
      - opengl

    environment:
      LD_PRELOAD: "${SNAP}/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/libmimalloc.so.2"

      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"

      NODE_ENV: production

      IMMICH_BUILD_DATA: "$SNAP/usr/lib/immich/build"

      TRANSFORMERS_CACHE: ${SNAP_COMMON}/cache

  # (it does not manage them): validates/persists the config CT pushes via
  # `snap set` and streams status callbacks to ct-callback-url. Driven by
  pre-refresh:
    plugs: [network]
  post-refresh:
    plugs: [network]
  remove:
    plugs: [network]

parts:
  immich:
    plugin: python

    source: https://github.com/immich-app/immich
    source-type: git
    source-depth: 1
    source-tag: v2.5.6

    build-snaps:
      - node/22/stable

    stage-snaps:
      - node/22/stable

    build-packages:
      - python3
      - python3-dev

      - libcfitsio-dev
      - libexif-dev
      - libexpat1-dev
      - libfftw3-dev
      - libglib2.0-dev
      - libgsf-1-dev
      - libheif-dev
      - libimagequant-dev
      - libjpeg-turbo8-dev
      - liblcms2-dev
      - libmatio-dev
      - libopenexr-dev
      - libopenjp2-7-dev
      - libopenslide-dev
      - liborc-dev
      - libpango1.0-dev
      - libpoppler-glib-dev
      - librsvg2-dev
      - libtiff5-dev
      - libvips-dev
      - libwebp-dev

    stage-packages:
      - python3:${CRAFT_ARCH_BUILD_FOR}
      - libstdc++6:${CRAFT_ARCH_BUILD_FOR}
      - libvips42:${CRAFT_ARCH_BUILD_FOR}
      - perl:${CRAFT_ARCH_BUILD_FOR}
      - ffmpeg:${CRAFT_ARCH_BUILD_FOR}
      - redis-server:${CRAFT_ARCH_BUILD_FOR}

    build-environment:
      - COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      - NODE_OPTIONS: --max-old-space-size=4096
      - SHARPIGNORE_GLOBAL_LIBVIPS: "true"
      - CI: "1"

    override-pull: |
      craftctl default

      patch -p1 < "${CRAFT_PROJECT_DIR}/patches/pgdump.patch"

      rm -f cli/LICENSE

      craftctl set version=$(git describe --tags)

      npm install --global corepack@latest --force

      corepack enable pnpm

      pnpm fetch \
        --ignore-scripts

      pnpm install \
        --offline \
        --filter immich \
        --frozen-lockfile

      _sharp_dir="$(pnpm patch sharp | sed -n '3p' | sed 's/^[[:space:]]*//')"

      cd "${_sharp_dir}"

      sed -i 's/|| npm run build",/|| pnpm run build",/' package.json

      cd -

      pnpm patch-commit "${_sharp_dir}"

      cd "${CRAFT_PART_SRC}/web"

      pnpm add 'three@^0.179.0'

    override-build: |
      install -Dm644 LICENSE \
        "${CRAFT_PART_INSTALL}/usr/lib/immich/app/LICENSE"

      mkdir -p \
        "${CRAFT_PART_INSTALL}/usr/bin" \
        "${CRAFT_PART_INSTALL}/usr/lib/immich/cli" \
        "${CRAFT_PART_INSTALL}/usr/lib/immich/build" \
        "${CRAFT_PART_INSTALL}/usr/lib/immich/app/server"

      cd "${CRAFT_PART_BUILD}/server"

      pnpm exec nest build \
        --type-check

      pnpm \
        --filter immich \
        --frozen-lockfile \
        build

      pnpm \
        --prod \
        --filter immich \
        --frozen-lockfile \
        deploy \
        "${CRAFT_PART_INSTALL}/usr/lib/immich/app/server"

      # pnpm 10 isolated deploy strips optional native deps. Restore sharp's
      # platform-specific @img/* packages from the build's virtual store and
      # re-link them where sharp's loader expects to find them.
      _dest_pnpm="${CRAFT_PART_INSTALL}/usr/lib/immich/app/server/node_modules/.pnpm"

      for _src_root in \
        "${CRAFT_PART_BUILD}/node_modules/.pnpm" \
        "${CRAFT_PART_SRC}/node_modules/.pnpm"; do
        [ -d "${_src_root}" ] || continue
        for _src in "${_src_root}"/@img+sharp-*; do
          [ -d "${_src}" ] || continue
          _base="$(basename "${_src}")"
          [ -d "${_dest_pnpm}/${_base}" ] || cp -af "${_src}" "${_dest_pnpm}/${_base}"
        done
      done

      _sharp_dir="$(find "${_dest_pnpm}" -maxdepth 1 -name 'sharp@*_patch_hash=*' -type d -print -quit)"
      if [ -n "${_sharp_dir}" ]; then
        mkdir -p "${_sharp_dir}/node_modules/@img"
        for _pnpm_pkg in "${_dest_pnpm}"/@img+sharp-*; do
          [ -d "${_pnpm_pkg}" ] || continue
          _base="$(basename "${_pnpm_pkg}")"
          _pkg="$(echo "${_base}" | sed -E 's/@img\+(sharp-[^@]+)@.*/\1/')"
          ln -sfn "../../../${_base}/node_modules/@img/${_pkg}" \
            "${_sharp_dir}/node_modules/@img/${_pkg}"
        done
      fi

      cd -

      pnpm \
        --filter @immich/sdk \
        --filter immich-web \
        --frozen-lockfile install

      pnpm \
        --filter @immich/sdk \
        --filter immich-web build

      mkdir -p \
        "${CRAFT_PART_INSTALL}/usr/lib/immich/build"

      cp -af \
        "${CRAFT_PART_BUILD}/web/build" \
        "${CRAFT_PART_INSTALL}/usr/lib/immich/build/www"

      install -Dm644 \
        "${CRAFT_PART_SRC}/plugins/manifest.json" \
        "${CRAFT_PART_INSTALL}/usr/lib/immich/build/corePlugin/manifest.json"

    stage:
      - -usr/lib/immich/app/server/bin
      - -usr/lib/immich/app/server/test
      - -usr/lib/immich/app/server/.nvmrc
      - -usr/lib/immich/app/server/Dockerfile
      - -usr/lib/immich/app/server/.prettierrc
      - -usr/lib/immich/app/server/nest-cli.json
      - -usr/lib/immich/app/server/pnpm-lock.yaml
      - -usr/lib/immich/app/server/.prettierignore

  machine-learning:
    plugin: uv

    source: https://github.com/immich-app/immich
    source-type: git
    source-depth: 1
    source-tag: v2.5.6

    source-subdir: machine-learning

    uv-extras:
      - cpu

    build-snaps:
      - astral-uv

    build-environment:
      - UV_PYTHON: python3

    stage-packages:
      - gunicorn:all
      - libgl1:${CRAFT_ARCH_BUILD_FOR}
      - libmimalloc2.0:${CRAFT_ARCH_BUILD_FOR}

    override-build: |
      craftctl default

      mkdir -p "${CRAFT_PART_INSTALL}/etc"

      cp -rf \
        machine-learning/immich_ml/log_conf.json \
        "${CRAFT_PART_INSTALL}/etc"

    override-stage: |
      craftctl default

      unlink "${CRAFT_STAGE}/bin/python"

      ln -sf python3 "${CRAFT_STAGE}/bin/python"

  build-lock:
    after:
      - immich


    source: https://github.com/immich-app/base-images
    source-type: git
    source-depth: 1

    build-packages:
      - jq

    override-prime: |
      jq -s '.' "${CRAFT_PART_SRC}/server/sources/"*.json > /tmp/sources.json

      jq -s '.' "${CRAFT_PART_SRC}/server/packages/"*.json > /tmp/packages.json

      jq -n \
        --slurpfile sources /tmp/sources.json \
        --slurpfile packages /tmp/packages.json \
        '{sources: $sources[0], packages: $packages[0]}' \
        > "${CRAFT_PRIME}/usr/lib/immich/build/build-lock.json"

      chmod 644 \
        "${CRAFT_PRIME}/usr/lib/immich/build/build-lock.json"

  geonames:

    source: https://download.geonames.org/export/dump/cities500.zip

    build-packages:
      - curl

    override-pull: |
      craftctl default

      mkdir -p \
        "${CRAFT_PART_INSTALL}/usr/lib/immich/build/geodata"

      curl -o \
        "${CRAFT_PART_INSTALL}/usr/lib/immich/build/geodata/admin1CodesASCII.txt" \
        https://download.geonames.org/export/dump/admin1CodesASCII.txt

      curl -o \
        "${CRAFT_PART_INSTALL}/usr/lib/immich/build/geodata/admin2Codes.txt" \
        https://download.geonames.org/export/dump/admin2Codes.txt

      curl -o \
        "${CRAFT_PART_INSTALL}/usr/lib/immich/build/geodata/ne_10m_admin_0_countries.geojson" \
        https://raw.githubusercontent.com/nvkelso/natural-earth-vector/v5.1.2/geojson/ne_10m_admin_0_countries.geojson

      cp -f \
        "${CRAFT_PART_SRC}/"* \
        "${CRAFT_PART_INSTALL}/usr/lib/immich/build/geodata"

      date --iso-8601=seconds | tr -d "\n" \
        > "${CRAFT_PART_INSTALL}/usr/lib/immich/build/geodata/geodata-date.txt"

  postgresql:

    stage-packages:
      - postgresql-16:${CRAFT_ARCH_BUILD_FOR}
      - postgresql-client-16:${CRAFT_ARCH_BUILD_FOR}
      - postgresql-16-pgvector:${CRAFT_ARCH_BUILD_FOR}

    stage:
      - -usr/bin/pg_dump
      - -usr/bin/pg_dumpall

  vchord:

    build-packages:
      - curl

    # Update _ver to match the version in immich-app/base-images
    override-build: |
      _ver="0.3.0"
      _arch=$(dpkg --print-architecture)
      _deb="postgresql-16-vchord_${_ver}-1_${_arch}.deb"
      curl -fsSL -o "/tmp/${_deb}" \
        "https://github.com/tensorchord/VectorChord/releases/download/${_ver}/${_deb}"
      dpkg-deb -x "/tmp/${_deb}" "${CRAFT_PART_INSTALL}"

  scripts:
    after:
      - build-lock
      - geonames
      - immich
      - machine-learning
      - postgresql
      - vchord

    plugin: dump

    source: src/

    override-build: |
      craftctl default

      sed -i \
        "s/_arch/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/" \
        "${CRAFT_PART_INSTALL}/pg_dumpall"

    organize:
      "*": usr/bin/

    override-prime: |
      craftctl default

      rm -f "${CRAFT_PRIME}/qemu_bcrypt."*

      # The libstdc++ that ends up bundled is older than what insightface's
      # mesh_core_cython.so (compiled from source during build) requires
      # (GLIBCXX_3.4.32). Drop it so the runtime falls back to core24's,
      # which is in sync with the build environment.
      rm -f "${CRAFT_PRIME}/usr/lib/"*"-linux-gnu/libstdc++.so."*

      # ---- Size reduction: strip build/dev artifacts not used at runtime ----
      # Runs in the assembled prime tree (this part is `after` the parts that
      # produce the bulk), so these removals slim the final snap.

      # C/C++ dev headers (node-gyp / python) — ~60MB, never needed at runtime.
      rm -rf "${CRAFT_PRIME}/include"

      # Python bytecode caches — ~170MB. Regenerated on demand; the ml service
      # sets PYTHONDONTWRITEBYTECODE anyway.
      find "${CRAFT_PRIME}" -type d -name '__pycache__' -prune -exec rm -rf {} +
      find "${CRAFT_PRIME}" -type f -name '*.pyc' -delete

      # Bundled test suites inside the ML site-packages — ~15MB. Scoped to
      # top-level tests/ dirs so we don't touch runtime modules like
      # numpy/testing.
      if [ -d "${CRAFT_PRIME}/lib/python3.12/site-packages" ]; then
        find "${CRAFT_PRIME}/lib/python3.12/site-packages" -maxdepth 2 -type d \
          \( -name tests -o -name test \) -prune -exec rm -rf {} +
      fi

  # python3 is already provided by the `immich` part's stage-packages, so this
  # only needs to place the engine at bin/ct-engine and the manifest at the
  # snap root (where ct-engine looks for $SNAP/plugin.yaml).
    stage-packages:
