name: all-dev-immich
base: core24
version: "2.7.5"
summary: "A secure, open-source media management platform for organizing and sharing.."
description: |
  Immich is a privacy-focused media management application that allows users to store, organize, and share photos and videos. It supports end-to-end encryption, automatic metadata extraction, and advanced search features. The application includes a web interface, mobile apps, and a backend service for managing media files and user accounts. It is built on a modern stack of Node.js, TypeScript, and Svelte, with support for machine learning-based features for image analysis and metadata extraction.

grade: stable
confinement: strict














apps:
  daemon:
    command: bin/ct-engine run
    daemon: simple                  # Optimized for headless background services
    restart-condition: always

    plugs:

      - network

      - network-bind

      - home



    environment:
      SNAP_USER_DATA: "$SNAP_DATA"
      SNAP_USER_COMMON: "$SNAP_COMMON"




parts:
  # Part 1: Upstream application
  all-dev-immich:
    plugin: npm
    source: https://github.com/immich-app/immich.git
    source-type: git

    
    # Common environment settings for production builds
    build-environment:
      - PATH: "$SNAPCRAFT_STAGE/usr/bin:$PATH"
      - LD_LIBRARY_PATH: "$SNAPCRAFT_STAGE/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:${LD_LIBRARY_PATH:-}"


    build-packages:

      - nodejs

      - nodejs-dev

      - libssl-dev

      - libffi-dev

      - libxslt1-dev

      - libavcodec-dev

      - libavformat-dev

      - libavutil-dev

      - libswscale-dev

      - libmimalloc-dev



    stage-packages:

      - ca-certificates

      - libssl3

      - libffi8

      - libxslt1.1

      - libavcodec1

      - libavformat1

      - libavutil1

      - libswscale1






    npm-node-version: 20



    override-build: |

      npm_config_engine_strict=false && NODE_OPTIONS="--max-old-space-size=6144" && pnpm install --frozen-lockfile && pnpm build

      cp -r * $SNAPCRAFT_PART_INSTALL/







  # Part 2: CT Engine
  ct-engine:
    plugin: dump
    source: .
    organize:
      src/ct_engine.py: bin/ct-engine
      snap/hooks/configure: snap/hooks/configure
    stage:
      - bin/ct-engine
      - snap/hooks/configure

  # Part 3: Plugin manifest
  plugin-manifest:
    plugin: dump
    source: .
    organize:
      plugin.yaml: plugin.yaml
    stage:
      - plugin.yaml

  # Part 4: Runtime dependencies for ct-engine
  runtime:
    plugin: nil
    stage-packages:
      - ca-certificates
      - python3-minimal